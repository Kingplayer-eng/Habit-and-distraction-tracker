  <div class="analytic-section">

    <div class="charts-container">
      <div class="chart-card">
        <h3>Weekly Completion Graph</h3>
              <canvas id="weeklyChart"></canvas>
             </div>
           <div class="chart-card">
                <h3>4 weeks Habit Report</h3>
             <canvas id="monthlyChart"></canvas>
         </div>
        </div>
    </div>

 
  <script src="script.js"></script>

   <div class="user-profile-bar">
     <label for="userSelect"> Active Profile:</label>
      <select id="userSelect">
         <option value="default">Default User </option>
           <option value="user_1">Profile  1 </option>
          <option value="user_2"> Profile 2  </option>
